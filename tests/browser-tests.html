<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Testes PipeSaver</title></head>
<body>
  <h1 id="status">RUNNING</h1>
  <pre id="details"></pre>
  <iframe id="app" src="../index.html" style="position:absolute;width:400px;height:900px;opacity:0;pointer-events:none"></iframe>
  <script>
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    document.getElementById('app').addEventListener('load', async () => {
      const log = [];
      try {
        const frame = document.getElementById('app'), win = frame.contentWindow, doc = frame.contentDocument;
        const core = win.PipeSaverCore;
        if (!core) throw new Error('API PipeSaverCore não carregada');
        if (!win.XLSX) throw new Error('SheetJS local não carregado');
        if (!doc.querySelector('.sidebar').firstElementChild.classList.contains('project-file-panel')) throw new Error('Arquivo do projeto não está acima da etapa 1');
        if (doc.getElementById('emptyState')) throw new Error('O painel vazio ainda está presente');
        if (doc.querySelector('.brand-name').textContent.replace(/\s/g, '') !== 'PipeSaver' || doc.querySelector('.brand small')) throw new Error('A marca PipeSaver não foi compactada corretamente');
        if (core.numberFrom('1.250,5') !== 1250.5) throw new Error('Conversão numérica pt-BR inválida');
        const languageSelect = doc.getElementById('languageSelect'), languageOptions = doc.querySelectorAll('#languageMenu [data-language]'), currentFlag = doc.getElementById('currentFlag');
        if (languageSelect.options.length !== 12 || languageOptions.length !== 12 || !currentFlag.getAttribute('src').endsWith('flags/br.svg')) throw new Error('Seletor de idiomas ou bandeira do Brasil inválido');
        await wait(50);
        if (!currentFlag.complete || !currentFlag.naturalWidth) throw new Error('Arquivo SVG da bandeira não foi carregado');
        const languageChecks = { 'en-US':'Cutting plan', 'es-ES':'Plan de corte', 'zh-CN':'切割方案', 'hi-IN':'कटिंग प्लान', 'ar-SA':'خطة القطع', 'fr-FR':'Plan de coupe', 'bn-BD':'কাটিং প্ল্যান', 'ru-RU':'Карта раскроя', 'de-DE':'Schnittplan', 'it-IT':'Piano di taglio', 'ja-JP':'切断プラン' };
        for (const [language, expected] of Object.entries(languageChecks)) {
          languageSelect.value = language; languageSelect.dispatchEvent(new Event('change'));
          if (doc.querySelector('[data-i18n="cuttingPlan"]').textContent !== expected) throw new Error(`Tradução inválida: ${language}`);
        }
        if (!currentFlag.getAttribute('src').endsWith('flags/jp.svg')) throw new Error('Bandeira selecionada não foi atualizada');
        languageSelect.value = 'ar-SA'; languageSelect.dispatchEvent(new Event('change'));
        if (doc.documentElement.dir !== 'rtl') throw new Error('Direção RTL do árabe inválida');
        languageSelect.value = 'pt-BR'; languageSelect.dispatchEvent(new Event('change'));
        if (doc.documentElement.dir !== 'ltr' || !currentFlag.getAttribute('src').endsWith('flags/br.svg')) throw new Error('Português ou bandeira do Brasil não foram restaurados');

        const base = { projectName:'Teste', material:'Aço', profile:{type:'rectTube',label:'Tubo retangular',dimensions:{width:80,height:40,thickness:3}}, stockLength:6000 };
        const noKerf = core.optimizeCuttingList({ ...base, kerf:0, cuts:[{id:'A',length:3000,quantity:2,colorIndex:0}] });
        if (noKerf.bins.length !== 1 || noKerf.totalWaste !== 0) throw new Error('Plano sem kerf incorreto');
        const withKerf = core.optimizeCuttingList({ ...base, kerf:3, cuts:[{id:'A',length:3000,quantity:2,colorIndex:0}] });
        if (withKerf.bins.length !== 2 || withKerf.totalKerfLoss !== 6 || withKerf.totalWaste !== 5994 || withKerf.utilization !== 50) throw new Error('Espessura de corte não foi respeitada');
        const exactFit = core.optimizeCuttingList({ ...base, kerf:3, cuts:[{id:'A',length:3000,quantity:1,colorIndex:0},{id:'B',length:2997,quantity:1,colorIndex:1}] });
        if (exactFit.bins.length !== 1 || Math.abs(exactFit.bins[0].used - 6000) > 1e-7 || !exactFit.optimal) throw new Error('Encaixe exato ou prova de ótimo incorreta');
        if (core.groupedPatterns(withKerf)[0].bins.length !== 2) throw new Error('Agrupamento de padrões iguais incorreto');
        const mixed = core.optimizeCuttingList({ ...base, name:'Estoque misto', kerf:3, stockTypes:[
          {id:'retalho-2003',kind:'scrap',length:2003,quantity:1},
          {id:'retalho-1000',kind:'scrap',length:1000,quantity:1},
          {id:'comercial-6000',kind:'commercial',length:6000,quantity:null}
        ], cuts:[{id:'M',length:1000,quantity:3,colorIndex:0}] });
        if (mixed.bins.length !== 2 || mixed.totalStockLength !== 3003 || mixed.totalWaste !== 0 || mixed.bins.some(bin => bin.stockType.kind !== 'scrap')) throw new Error('Seleção de barras mistas incorreta');
        const regularStock = core.optimizeCuttingList({ ...base, name:'Sem prioridade', kerf:3, stockTypes:[
          {id:'barra-4000',length:4000,quantity:1,priority:false},
          {id:'barra-6000',length:6000,quantity:2,priority:false}
        ], cuts:[{id:'R',length:1250,quantity:8,colorIndex:0}] });
        const priorityStock = core.optimizeCuttingList({ ...base, name:'Com prioridade', kerf:3, stockTypes:[
          {id:'barra-4000',length:4000,quantity:1,priority:true},
          {id:'barra-6000',length:6000,quantity:2,priority:false}
        ], cuts:[{id:'R',length:1250,quantity:8,colorIndex:0}] });
        if (regularStock.bins.length !== 2 || regularStock.bins.some(bin => bin.stockLength !== 6000)) throw new Error('Otimização normal de barras incorreta');
        if (priorityStock.bins.length !== 3 || priorityStock.bins.filter(bin => bin.stockType.priority && bin.stockLength === 4000).length !== 1) throw new Error('Barra prioritária não foi consumida primeiro');
        let shortageDetected = false;
        try { core.optimizeCuttingList({ ...base, name:'Estoque finito', kerf:0, stockTypes:[{id:'unico',kind:'scrap',length:1000,quantity:1}], cuts:[{id:'F',length:1000,quantity:2,colorIndex:0}] }); }
        catch (error) { shortageDetected = /insuficiente/.test(error.message); }
        if (!shortageDetected) throw new Error('Limite de quantidade das barras não foi respeitado');
        const project = core.optimizeProject({ projectName:'Projeto completo', profiles:[
          { ...base, id:'perfil-a', name:'Perfil A', kerf:0, stockTypes:[{id:'a-6000',kind:'commercial',length:6000,quantity:null}], cuts:[{id:'A',length:1000,quantity:2,colorIndex:0}] },
          { ...base, id:'perfil-b', name:'Perfil B', kerf:0, stockTypes:[{id:'b-3000',kind:'commercial',length:3000,quantity:null}], cuts:[{id:'B',length:500,quantity:2,colorIndex:0}] }
        ] });
        if (project.profileResults.length !== 2 || project.totalPieces !== 4 || project.totalBars !== 2) throw new Error('Perfis diferentes foram misturados ou não agregados corretamente');
        log.push('Otimizador 1D: OK', 'Kerf: OK', 'Estoque misto e finito: OK', 'Prioridade de barras: OK', 'Projeto multi-perfil: OK', 'Agrupamento de padrões: OK');

        const originalWriteFile = win.XLSX.writeFile; let downloadedWorkbook = null, downloadedName = '';
        win.XLSX.writeFile = (workbook, name) => { downloadedWorkbook = workbook; downloadedName = name; };
        doc.getElementById('templateButton').click();
        const expectedSheets = ['Perfis','Barras','Cortes','Configuracoes','Instrucoes'];
        if (downloadedWorkbook.SheetNames.join('|') !== expectedSheets.join('|') || downloadedName !== 'modelo_completo_pipesaver.xlsx') throw new Error('Modelo Excel completo não foi gerado');
        const templateProfileRows = win.XLSX.utils.sheet_to_json(downloadedWorkbook.Sheets.Perfis, {header:1,defval:''});
        if (!['Diametro_mm','Lado_mm','Largura_mm','Altura_mm','Aba_A_mm','Aba_B_mm','Espessura_mm','Descricao_secao'].every(header => templateProfileRows[0].includes(header)) || templateProfileRows.length < 8 || !downloadedWorkbook.Sheets.Perfis['!autofilter'] || !downloadedWorkbook.Sheets.Barras['!autofilter'] || !downloadedWorkbook.Sheets.Cortes['!autofilter']) throw new Error('Modelo não contém todas as dimensões de seção e filtros');

        const cutsBody = doc.getElementById('cutsBody');
        if (cutsBody.children.length !== 1) throw new Error('Lista inicial de medidas inválida');
        if (/\bblank/i.test(doc.body.textContent)) throw new Error('O termo blank ainda aparece na interface');
        const profileList = doc.getElementById('profileList'), profileItems = () => [...profileList.querySelectorAll('.profile-list-item')];
        if (profileItems().length !== 1 || doc.getElementById('stockBody').children.length !== 1) throw new Error('Cadastro inicial do perfil inválido');
        doc.getElementById('profileName').value = 'Longarinas';
        doc.getElementById('profileName').dispatchEvent(new Event('input'));
        doc.getElementById('addProfileButton').click();
        if (profileItems().length !== 2 || doc.getElementById('profileName').value !== 'Perfil 2') throw new Error('Botão adicionar perfil falhou');
        doc.getElementById('addProfileButton').click();
        profileItems()[2].querySelector('.profile-list-remove').click();
        if (profileItems().length !== 2 || doc.getElementById('profileName').value !== 'Perfil 2') throw new Error('Remoção pela lista de perfis falhou');
        profileItems()[0].querySelector('.profile-list-select').click();
        if (doc.getElementById('profileName').value !== 'Longarinas') throw new Error('Dados não foram preservados ao trocar de perfil');
        if (!profileItems()[0].classList.contains('active') || !profileItems()[0].textContent.includes('Longarinas')) throw new Error('Lista visível de perfis não indicou o item em edição');
        const stockBody = doc.getElementById('stockBody');
        doc.getElementById('addStockButton').click();
        const firstProfileId = profileItems()[0].dataset.profileId;
        if (stockBody.children.length !== 2 || stockBody.lastElementChild.querySelector('.stock-profile').value !== firstProfileId) throw new Error('Botão adicionar barra falhou');
        doc.getElementById('addStockButton').click();
        stockBody.lastElementChild.querySelector('.remove-stock').click();
        if (stockBody.children.length !== 2) throw new Error('Remoção de barra falhou');
        const stockRows = [...stockBody.querySelectorAll('.stock-row')];
        stockRows[0].querySelector('.stock-length').value = '6000'; stockRows[0].querySelector('.stock-quantity').value = '2';
        stockRows[1].querySelector('.stock-length').value = '4000'; stockRows[1].querySelector('.stock-quantity').value = '1'; stockRows[1].querySelector('.stock-priority').checked = true;
        doc.getElementById('addCutButton').click();
        if (cutsBody.children.length !== 2 || cutsBody.lastElementChild.querySelector('.cut-profile').value !== firstProfileId) throw new Error('Botão adicionar medida falhou');
        cutsBody.querySelector('.cut-row:last-child .remove-cut').click();
        doc.getElementById('sectionType').value = 'roundTube';
        doc.getElementById('sectionType').dispatchEvent(new Event('change'));
        if (doc.querySelectorAll('#dimensionFields input').length !== 2) throw new Error('Campos dinâmicos da seção falharam');
        const dimensionInputs = [...doc.querySelectorAll('#dimensionFields input')];
        if (Math.abs(dimensionInputs[0].getBoundingClientRect().top - dimensionInputs[1].getBoundingClientRect().top) > 0.5) throw new Error('Diâmetro e espessura do tubo redondo estão desalinhados');

        const row = cutsBody.children[0];
        row.querySelector('.cut-id').value = 'T01'; row.querySelector('.cut-length').value = '1000'; row.querySelector('.cut-quantity').value = '6';
        doc.getElementById('projectName').value = 'Projeto salvo';
        doc.getElementById('saveProjectButton').click();
        const savedProfiles = win.XLSX.utils.sheet_to_json(downloadedWorkbook.Sheets.Perfis, {defval:''}), savedStocks = win.XLSX.utils.sheet_to_json(downloadedWorkbook.Sheets.Barras, {defval:''}), savedCuts = win.XLSX.utils.sheet_to_json(downloadedWorkbook.Sheets.Cortes, {defval:''}), savedSettings = win.XLSX.utils.sheet_to_json(downloadedWorkbook.Sheets.Configuracoes, {header:1,defval:''});
        if (!downloadedName.includes('Projeto_salvo_projeto_pipesaver') || savedProfiles.length !== 2 || savedStocks.length !== 2 || savedStocks[1].Priorizar !== 'Sim' || savedCuts[0].Identificacao !== 'T01' || !savedSettings.some(item => item[0] === 'Nome_projeto' && item[1] === 'Projeto salvo')) throw new Error('Salvamento do formulário em Excel falhou');
        doc.getElementById('optimizeButton').click();
        for (let retry = 0; retry < 40 && doc.getElementById('resultContent').hidden; retry++) await wait(50);
        if (doc.getElementById('resultContent').hidden || doc.getElementById('metricBars').textContent !== '2') throw new Error('Fluxo da interface não gerou o plano esperado');

        const workbook = win.XLSX.utils.book_new();
        win.XLSX.utils.book_append_sheet(workbook, win.XLSX.utils.aoa_to_sheet([['Identificacao','Comprimento_mm','Quantidade'],['IMP-01',1500,2]]), 'Cortes');
        const bytes = win.XLSX.write(workbook, { bookType:'xlsx', type:'array' });
        const transfer = new win.DataTransfer();
        transfer.items.add(new win.File([bytes], 'teste.xlsx', { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
        const input = doc.getElementById('excelInput');
        Object.defineProperty(input, 'files', { configurable:true, value:transfer.files });
        input.dispatchEvent(new win.Event('change'));
        for (let retry = 0; retry < 40 && cutsBody.querySelector('.cut-id').value !== 'IMP-01'; retry++) await wait(50);
        if (cutsBody.children.length !== 1 || cutsBody.querySelector('.cut-length').value !== '1500' || cutsBody.querySelector('.cut-quantity').value !== '2') throw new Error('Importação XLSX inválida');

        const fullWorkbook = win.XLSX.utils.book_new();
        win.XLSX.utils.book_append_sheet(fullWorkbook, win.XLSX.utils.aoa_to_sheet([
          ['Perfil','Material','Tipo_secao','Diametro_mm','Lado_mm','Largura_mm','Altura_mm','Aba_A_mm','Aba_B_mm','Espessura_mm','Descricao_secao'],
          ['Tubos Ø60','Aço carbono','Tubo redondo',60,'','','','','',3,''],
          ['Travessas 80x40','Aço carbono','Tubo retangular','','',80,40,'','',3,'']
        ]), 'Perfis');
        win.XLSX.utils.book_append_sheet(fullWorkbook, win.XLSX.utils.aoa_to_sheet([
          ['Perfil','Comprimento_barra_mm','Quantidade','Priorizar'],
          ['Tubos Ø60',6000,2,'Não'],
          ['Tubos Ø60',1800,1,'Sim'],
          ['Travessas 80x40',12000,4,'Não']
        ]), 'Barras');
        win.XLSX.utils.book_append_sheet(fullWorkbook, win.XLSX.utils.aoa_to_sheet([
          ['Perfil','Identificacao','Comprimento_mm','Quantidade','Observacao'],
          ['Tubos Ø60','TP-01',1200,3,'Corte principal'],
          ['Travessas 80x40','TR-01',850,5,'Separar por lote']
        ]), 'Cortes');
        win.XLSX.utils.book_append_sheet(fullWorkbook, win.XLSX.utils.aoa_to_sheet([
          ['Configuracao','Valor'],
          ['Nome_projeto','Projeto importado'],
          ['Espessura_corte_mm',2]
        ]), 'Configuracoes');
        const fullBytes = win.XLSX.write(fullWorkbook, { bookType:'xlsx', type:'array' });
        const fullTransfer = new win.DataTransfer();
        fullTransfer.items.add(new win.File([fullBytes], 'projeto-completo.xlsx', { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
        Object.defineProperty(input, 'files', { configurable:true, value:fullTransfer.files });
        input.dispatchEvent(new win.Event('change'));
        for (let retry = 0; retry < 40 && (profileItems()[0]?.querySelector('strong').textContent !== 'Tubos Ø60' || cutsBody.querySelector('.cut-id')?.value !== 'TP-01'); retry++) await wait(50);
        if (profileItems().length !== 2 || stockBody.children.length !== 3 || cutsBody.children.length !== 2 || cutsBody.querySelector('.cut-id').value !== 'TP-01' || doc.getElementById('kerf').value !== '2' || !stockBody.children[1].querySelector('.stock-priority').checked) throw new Error('Importação do projeto completo inválida');
        profileItems()[1].querySelector('.profile-list-select').click();
        const secondProfileId = profileItems()[1].dataset.profileId, secondCut = [...cutsBody.children].find(item => item.querySelector('.cut-profile').value === secondProfileId), secondStock = [...stockBody.children].find(item => item.querySelector('.stock-profile').value === secondProfileId);
        if (doc.getElementById('sectionType').value !== 'rectTube' || secondCut?.querySelector('.cut-id').value !== 'TR-01' || secondStock?.querySelector('.stock-length').value !== '12000') throw new Error('Relacionamento entre perfis, barras e cortes importados inválido');
        doc.getElementById('saveProjectButton').click();
        const roundTripCuts = win.XLSX.utils.sheet_to_json(downloadedWorkbook.Sheets.Cortes, {defval:''});
        if (roundTripCuts[0].Observacao !== 'Corte principal' || roundTripCuts[1].Observacao !== 'Separar por lote') throw new Error('Observações não foram preservadas ao reabrir e salvar o projeto');
        win.XLSX.writeFile = originalWriteFile;

        if (doc.documentElement.dataset.unit !== 'mm') throw new Error('Unidade padrão não é mm');
        if (Math.abs(core.convertUnit(25.4, 'mm', 'in') - 1) > 1e-9 || Math.abs(core.convertUnit(1, 'in', 'mm') - 25.4) > 1e-9) throw new Error('Conversão mm/in incorreta');
        const unitToggle = doc.getElementById('unitToggle');
        if (!unitToggle) throw new Error('Alternador de unidade não encontrado');
        const kerfMm = Number(doc.getElementById('kerf').value);
        const dimensionInputsMm = [...doc.querySelectorAll('#dimensionFields input')].map(el => Number(el.value));
        unitToggle.click();
        if (doc.documentElement.dataset.unit !== 'in') throw new Error('Alternância para polegadas falhou');
        if (win.localStorage.getItem('pipesaver-unit') !== 'in') throw new Error('Preferência de unidade não foi persistida');
        if (!doc.querySelector('#dimensionFields span').textContent.includes('(in)')) throw new Error('Rótulo das dimensões não indicou polegadas');
        const kerfIn = Number(doc.getElementById('kerf').value);
        if (Math.abs(kerfIn - kerfMm / 25.4) > 0.01) throw new Error('Espessura de corte não converteu para polegadas');
        const dimensionInputsIn = [...doc.querySelectorAll('#dimensionFields input')].map(el => Number(el.value));
        if (dimensionInputsIn.some((value, index) => Math.abs(value - dimensionInputsMm[index] / 25.4) > 0.01)) throw new Error('Dimensões do perfil não converteram para polegadas');
        unitToggle.click();
        if (doc.documentElement.dataset.unit !== 'mm' || win.localStorage.getItem('pipesaver-unit') !== 'mm') throw new Error('Alternância de volta para milímetros falhou');
        if (Math.abs(Number(doc.getElementById('kerf').value) - kerfMm) > 0.05) throw new Error('Ida e volta mm→in→mm perdeu precisão da espessura de corte');
        const dimensionInputsRoundTrip = [...doc.querySelectorAll('#dimensionFields input')].map(el => Number(el.value));
        if (dimensionInputsRoundTrip.some((value, index) => Math.abs(value - dimensionInputsMm[index]) > 0.05)) throw new Error('Ida e volta mm→in→mm perdeu precisão das dimensões');
        log.push('Interface multi-perfil: OK', 'Idiomas e bandeiras: OK (12 opções)', 'Modelo Excel completo: OK', 'Salvar e retomar projeto: OK', 'Importação XLSX simples: OK', 'Importação de projeto completo: OK', 'Biblioteca local: OK', 'Alternador métrico/imperial: OK');
        document.getElementById('status').textContent = 'PASS';
      } catch (error) {
        document.getElementById('status').textContent = 'FAIL';
        log.push(error.stack || error.message);
      }
      document.getElementById('details').textContent = log.join('\n');
    });
  </script>
</body>
</html>
